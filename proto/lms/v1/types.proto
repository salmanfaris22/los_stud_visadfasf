  google.protobuf.Timestamp at = 1;
  int32 requests = 2;
  int32 err_4xx = 3;
  int32 err_5xx = 4;
  double avg_ms = 5;
  double p95_ms = 6;
  bool has_sample = 7;
  double cpu_pct = 8;
  double mem_pct = 9;
  double swap_pct = 10;
  double load1 = 11;
  double net_rx_rate = 12;
  double net_tx_rate = 13;
  int32 online = 14;
  int32 db_conns = 15;
  int32 open_streams = 16;
}

