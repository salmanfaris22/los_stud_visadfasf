name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: lms, POSTGRES_PASSWORD: lms, POSTGRES_DB: lms_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lms" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod }
      - name: sqlc diff
        uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.31.1" }
      - run: sqlc diff
      - run: go vet ./...
      - run: go test ./... -count=1
        env: { TEST_DATABASE_URL: "postgres://lms:lms@localhost:5432/lms_test?sslmode=disable" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install
      - name: buf lint (proto contract)
        working-directory: .
        run: PATH="$PWD/frontend/node_modules/.bin:$PATH" buf lint
      - run: pnpm typecheck
      - run: pnpm build
